<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dini — DevOps Bootcamp 2026</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .card {
      width: min(360px, 90vw);
      padding: 2rem;
      border-radius: 24px;
      background: linear-gradient(160deg, #1e293b, #111827);
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
      animation: fade-in 0.9s ease both;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 55px rgba(0, 0, 0, 0.55);
    }

    .badge {
      display: inline-block;
      margin-bottom: 1.25rem;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f8fafc;
      background: linear-gradient(120deg, #6366f1, #06b6d4, #8b5cf6);
      background-size: 200% 200%;
      animation: pulse 2.6s ease-in-out infinite;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
      font-weight: 700;
    }

    p {
      margin: 0.25rem 0;
      color: #94a3b8;
    }

    p span { color: #e2e8f0; font-weight: 600; }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        background-position: 0% 50%;
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.5);
      }
      50% {
        transform: scale(1.05);
        background-position: 100% 50%;
        box-shadow: 0 0 22px 4px rgba(99, 102, 241, 0.45);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .badge { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">DevOps Bootcamp 2026</div>
    <h1>Dini</h1>
    <p>Role: <span>DevOps</span></p>
    <p>Cohort: <span>2</span></p>
  </main>
</body>
</html>
